<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Gear with crossed wrench and screwdriver" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Moto workshop gear and tools</title>
  <defs>
    <mask id="gearHole">
      <rect width="400" height="400" fill="#fff"/>
      <circle cx="200" cy="200" r="40" fill="#000"/>
    </mask>
    <mask id="wrenchNotch">
      <rect width="400" height="400" fill="#fff"/>
      <rect x="187" y="78" width="26" height="38" fill="#000"/>
    </mask>
  </defs>

  <!-- Gear -->
  <g fill="#f26a1b" mask="url(#gearHole)">
    <circle cx="200" cy="200" r="100"/>
    <g id="tooth"><rect x="184" y="66" width="32" height="38" rx="5"/></g>
    <use href="#tooth" transform="rotate(30 200 200)"/>
    <use href="#tooth" transform="rotate(60 200 200)"/>
    <use href="#tooth" transform="rotate(90 200 200)"/>
    <use href="#tooth" transform="rotate(120 200 200)"/>
    <use href="#tooth" transform="rotate(150 200 200)"/>
    <use href="#tooth" transform="rotate(180 200 200)"/>
    <use href="#tooth" transform="rotate(210 200 200)"/>
    <use href="#tooth" transform="rotate(240 200 200)"/>
    <use href="#tooth" transform="rotate(270 200 200)"/>
    <use href="#tooth" transform="rotate(300 200 200)"/>
    <use href="#tooth" transform="rotate(330 200 200)"/>
  </g>

  <!-- Wrench -->
  <g transform="rotate(45 200 200)" fill="#22262b" stroke="#f5f5f5" stroke-width="3" stroke-linejoin="round">
    <g mask="url(#wrenchNotch)">
      <circle cx="200" cy="118" r="34"/>
      <rect x="189" y="140" width="22" height="190" rx="11"/>
    </g>
    <circle cx="200" cy="312" r="5" fill="#f26a1b" stroke="none"/>
  </g>

  <!-- Screwdriver -->
  <g transform="rotate(-45 200 200)" stroke="#f5f5f5" stroke-width="3" stroke-linejoin="round">
    <rect x="196" y="92" width="8" height="165" rx="2" fill="#9aa3ad"/>
    <path d="M196 92 L204 92 L202 76 L198 76 Z" fill="#9aa3ad"/>
    <rect x="186" y="250" width="28" height="86" rx="12" fill="#22262b"/>
    <g stroke="#f26a1b" stroke-width="3" stroke-linecap="round">
      <line x1="193" y1="270" x2="207" y2="270"/>
      <line x1="193" y1="286" x2="207" y2="286"/>
      <line x1="193" y1="302" x2="207" y2="302"/>
    </g>
  </g>
</svg>
